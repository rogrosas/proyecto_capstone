<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contrato · Easy Office</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#EEF0F1;font-family:'Albert Sans',sans-serif;color:#222;}
  .barra{position:sticky;top:0;background:#282828;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 24px;font-size:13px;z-index:2;}
  .barra button{background:#24D356;color:#fff;border:none;border-radius:3px;padding:9px 18px;font-weight:600;cursor:pointer;font-family:inherit;}
  .hoja{max-width:820px;margin:28px auto;background:#fff;padding:60px 70px;box-shadow:0 5px 20px rgba(0,0,0,.1);font-family:'Lora',serif;font-size:14px;line-height:1.75;text-align:justify;}
  .hoja h1{font-size:17px;text-align:center;margin:0 0 4px;letter-spacing:.5px;}
  .folio{text-align:center;font-family:'Albert Sans',sans-serif;font-size:12px;color:#69727D;margin-bottom:28px;}
  .hoja h2{font-size:14px;margin:22px 0 6px;}
  .hoja b{font-weight:700;}
  table{width:100%;border-collapse:collapse;font-family:'Albert Sans',sans-serif;font-size:12.5px;margin:10px 0;}
  th,td{border:1px solid #ccc;padding:7px 9px;text-align:left;vertical-align:top;}
  th{background:#F5F7F7;}
  .r{text-align:right;white-space:nowrap;}
  .firmas{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:70px;text-align:center;font-family:'Albert Sans',sans-serif;font-size:12px;}
  .firmas div{border-top:1px solid #222;padding-top:8px;}
  .salto{page-break-before:always;}
  .aviso{max-width:820px;margin:0 auto;font-size:12px;color:#7A5209;background:#FBF0DC;padding:10px 14px;}
  .error{max-width:820px;margin:40px auto;background:#FCEBE8;color:#D8402F;padding:16px;font-family:'Albert Sans',sans-serif;}
  @media print{body{background:#fff;} .barra,.aviso{display:none;} .hoja{box-shadow:none;margin:0;padding:0 10mm;max-width:none;}}
</style>
</head>
<body>
<div class="barra"><span id="titulo">Cargando contrato…</span><button onclick="window.print()">Imprimir / guardar PDF</button></div>
<div class="aviso">Borrador armado con los datos de la base de datos (vistas v_datos_contrato y v_datos_contrato_servicios). El texto legal definitivo es el de la plantilla oficial de Easy Office.</div>
<div id="contrato"></div>
<script type="module" src="/js/crm/impresion.js"></script>
</body>
</html>
